# Playground stub — succeeds instantly; builds and analyses nothing. The
# playground is the Release Wizard's test rig, so the real SDK build + analysis
# only runs on the canonical eForms-SDK repo. The triggers mirror the canonical
# (push on the trunk branches only, plus pull_request / manual) so a playground
# PR shows the same check, fires it once, and never twice.

name: Build and analyze eForms SDK

on:
  # Build on pushes to the trunk only (i.e. merges). Source branches are built
  # via pull_request, so pushing one with an open PR runs the checks just once.
  push:
    branches:
      - develop
      - efx-2
  pull_request:

  # Allows to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  analyze:
    name: Simulate analyse (playground stub)
    runs-on: ubuntu-latest
    steps:
      - name: Simulate build + analyse
        run: echo "Playground stub — no real SDK build or analysis. Exiting success."
