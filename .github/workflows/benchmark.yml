# Playground stub — succeeds instantly; runs no real benchmark. The playground
# is the Release Wizard's test rig, so the real Schematron benchmark only runs on
# the canonical eForms-SDK repo. The triggers mirror the canonical (push on the
# trunk branches only, plus pull_request / manual / schedule) so a playground PR
# shows the same check, fires it once, and never twice.

name: Benchmark Schematron rules with the SDK Analyzer

on:
  # Build on pushes to the trunk only (i.e. merges). Source branches are built
  # via pull_request, so pushing one with an open PR runs the checks just once.
  push:
    branches:
      - develop
      - efx-2
  pull_request:
  # Allows to also run this workflow manually from the Actions tab
  workflow_dispatch:
  # Run this workflow every Tuesday and Friday at 05:00
  schedule:
    # * is a special character in YAML so you have to quote this string
    - cron:  '0 5 * * 2,5'

jobs:
  benchmark:
    name: Simulate benchmark (playground stub)
    runs-on: ubuntu-latest
    steps:
      - name: Simulate benchmark
        run: echo "Playground stub — no real benchmark. Exiting success."