# PLAYGROUND COPY — publishes nothing to Maven Central.
#
# This is production's publish workflow (OP-TED/eForms-SDK, branch develop, as of September
# 2026) with exactly one change: the two steps that need secrets — importing the GPG signing
# key and `mvn deploy` to Maven Central — are replaced by one simulated step that runs under
# the same condition.
#
# Everything else is production's own logic, on purpose:
# - the same triggers (a release being *published*, pushes to develop and efx-2, manual runs),
#   so the release wizard's polling sees the same runs as in production;
# - the real publication check, .github/scripts/validate-publication.sh. It is NOT overlaid:
#   the playground refresh copies production's current script, so the playground rejects
#   exactly what production would reject (for example a release whose tag is not the merge
#   commit of a prepare/* → develop|efx-2 or release/* → main pull request), and fails loudly
#   if production moves or changes it.
#
# When production's publish workflow changes, update this copy to match.

name: Publish package to the Maven Central Repository

on:
  push:
    branches:
      - 'develop'
      - 'efx-2'

  release:
    # 'published' fires when a release is published, including when a draft
    # is published. 'created' does not fire for draft-then-publish, so it
    # would miss releases prepared as drafts.
    types: [published]

  # Allows to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java for publishing to Maven Central Repository
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'adopt'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
      - name: Read project version
        id: project
        shell: bash
        run: |
          version="$(mvn --batch-mode help:evaluate \
            -Dexpression=project.version \
            -DforceStdout \
            -q)"
          if [[ -z "${version}" || "${version}" == *$'\n'* ]]; then
            echo "::error::Could not resolve one project version from pom.xml."
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - name: Validate publication context
        id: publication
        shell: bash
        env:
          PROJECT_VERSION: ${{ steps.project.outputs.version }}
          RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/scripts/validate-publication.sh
      - name: Simulate signing and publishing to the Maven Central Repository
        if: steps.publication.outputs.publish == 'true'
        shell: bash
        env:
          PROJECT_VERSION: ${{ steps.project.outputs.version }}
          # A release publication takes minutes in production; a snapshot push is quick.
          SIMULATED_SECONDS: ${{ github.event_name == 'release' && '120' || '5' }}
        run: |
          echo "================================================"
          echo " PLAYGROUND — nothing is signed or uploaded."
          echo " Production would now sign ${PROJECT_VERSION} and"
          echo " deploy it to Maven Central."
          echo "================================================"
          sleep "${SIMULATED_SECONDS}"
          echo "Simulated publication of ${PROJECT_VERSION} complete."
